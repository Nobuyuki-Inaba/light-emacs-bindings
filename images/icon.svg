<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- What it is: Emacs keybindings -->
  <text x="64" y="44" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="0.5" fill="#c4b5fd">Emacs</text>

  <!-- What it keeps: Copy / Cut / Paste keycaps -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#1e1b4b" text-anchor="middle">
    <rect x="10" y="63" width="32" height="36" rx="9" fill="#6d28d9"/>
    <rect x="10" y="58" width="32" height="36" rx="9" fill="#ede9fe"/>
    <text x="26" y="84">C</text>

    <rect x="48" y="63" width="32" height="36" rx="9" fill="#6d28d9"/>
    <rect x="48" y="58" width="32" height="36" rx="9" fill="#ede9fe"/>
    <text x="64" y="84">X</text>

    <rect x="86" y="63" width="32" height="36" rx="9" fill="#6d28d9"/>
    <rect x="86" y="58" width="32" height="36" rx="9" fill="#ede9fe"/>
    <text x="102" y="84">V</text>
  </g>

  <!-- ...and they still work -->
  <circle cx="106" cy="104" r="14" fill="#22c55e" stroke="#0f172a" stroke-width="5"/>
  <polyline points="99,104 104,108 113,100" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
